<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선급비용 명세서</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb; --head:#eef2f8;
  --accent:#2457c5; --accent-ink:#fff; --ok:#137a43; --ok-bg:#e6f4ec; --bad:#c0262d; --bad-bg:#fdecec;
  --warn:#8a5a00; --warn-bg:#fff4d6; --past:#fff8e1; --cur:#fde8dc; --mono:"Consolas","D2Coding",monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --panel:#1c2027; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2e343e; --head:#232a35;
    --accent:#6c97ff; --accent-ink:#0b1020; --ok:#5fd394; --ok-bg:#16301f; --bad:#ff7b7b; --bad-bg:#3a1a1c;
    --warn:#ffcf66; --warn-bg:#3a2f12; --past:#2c2816; --cur:#3d2418; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","맑은 고딕",system-ui,sans-serif}
header{padding:20px 24px 8px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}
header p{margin:0;color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:12px 24px 48px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.inputs{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:stretch}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);transition:.15s}
.drop.hover,.drop:hover{border-color:var(--accent);color:var(--ink)}
.drop strong{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:8px;min-width:240px}
label{font-weight:600;font-size:13px}
input[type=month]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:10px}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.main .v{color:var(--accent)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border-radius:7px 7px 0 0;border-bottom:none;font-weight:500}
.tabs button.on{background:var(--head);font-weight:700}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:0 8px 8px 8px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;background:var(--panel)}
th{background:var(--head);position:sticky;top:0;z-index:2;font-size:12.5px;text-align:center}
td.n{text-align:right} td.c{text-align:center}
td.memo{max-width:340px;overflow:hidden;text-overflow:ellipsis}
tr.tot td{font-weight:700;background:var(--head)}
td.past{background:var(--past)} td.cur,th.cur{background:var(--cur);font-weight:700}
td.bad{color:var(--bad);font-weight:700}
.stick{position:sticky;left:0;z-index:1} th.stick{z-index:3}
.stick2{position:sticky;left:42px;z-index:1} th.stick2{z-index:3}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-2px;margin:0 4px 0 10px}
.hidden{display:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:720px){ header,main{padding-left:16px;padding-right:16px} .inputs{grid-template-columns:1fr} .side{min-width:0} }
</style>
</head>
<body>
<header>
  <h1>선급비용 명세서 생성기</h1>
  <p>ERP 원자료 엑셀을 올리면 월별 비용·월말 잔액·원장 대사가 담긴 수식 명세서를 만듭니다. 계산: 분 단위 기간, 기준일 24:00, 잔여비율 소수 5자리 반올림.</p>
</header>
<main>
  <section class="panel">
    <div class="inputs">
      <div class="drop" id="drop">
        <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
        <div id="dropText"><strong>원자료 엑셀을 여기에 끌어 놓거나 클릭해서 선택</strong><br>예: 선급비용('26.10).xlsx</div>
      </div>
      <div class="side">
        <label for="month">기준월 (월말 24:00 기준)</label>
        <input type="month" id="month">
        <span class="hint">비워 두면 원자료 결산일자 중 가장 많은 날짜를 씁니다.</span>
        <button class="primary" id="run" disabled>명세서 만들기</button>
      </div>
    </div>
  </section>

  <div id="msgs"></div>

  <div id="result" class="hidden">
    <div class="kpis" id="kpis"></div>
    <div class="bar">
      <div class="tabs" id="tabs">
        <button data-t="month" class="on">월별 추이</button>
        <button data-t="items">건별 명세</button>
        <button data-t="matrix">건별 월별 비용</button>
        <button data-t="balmatrix">건별 월말 잔액</button>
        <button data-t="ledger">원장 대사</button>
      </div>
      <div>
        <button id="dl" class="primary">엑셀 다운로드</button>
        <button id="save">작업 폴더에 저장</button>
      </div>
    </div>
    <div class="tablewrap"><table id="tbl"></table></div>
    <div class="legend" id="legend"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = v => v == null || v === '' ? '' : (Math.round(v) === 0 ? '-' : Math.round(v).toLocaleString('ko-KR'));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let file = null, src = null, R = null, tab = 'month';   // src: 마지막으로 고른 원자료 (Vercel에서는 다시 만들 때마다 재전송)

const drop = $('#drop'), fi = $('#file');
drop.onclick = () => fi.click();
fi.onchange = () => pick(fi.files[0]);
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add('hover');}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove('hover');}));
drop.addEventListener('drop', ev => pick(ev.dataTransfer.files[0]));
function pick(f){
  if(!f) return;
  file = f; src = f; R = null;
  $('#dropText').innerHTML = `<strong>${esc(f.name)}</strong><br>${(f.size/1024).toFixed(0)} KB · 다른 파일로 바꾸려면 클릭`;
  $('#run').disabled = false;
  const m = f.name.match(/'(\d{2})\.(\d{1,2})\)/);
  if(m) $('#month').value = `20${m[1]}-${m[2].padStart(2,'0')}`;
}
$('#month').onchange = () => { if(R) $('#run').disabled = false; };

function monthEnd(v){ const [y,m] = v.split('-').map(Number); const d = new Date(y, m, 0).getDate(); return `${v}-${String(d).padStart(2,'0')}`; }
function msg(html, cls){ $('#msgs').insertAdjacentHTML('beforeend', `<div class="msg ${cls}">${html}</div>`); }

$('#run').onclick = async () => {
  const fd = new FormData();
  if(R && R.cloud && !file) fd.append('file', src);
  else if(R && !file) fd.append('job', R.job); else if(file) fd.append('file', file);
  if($('#month').value) fd.append('base_date', monthEnd($('#month').value));
  const b = $('#run'); b.disabled = true; b.innerHTML = '<span class="spinner"></span> 만드는 중…';
  $('#msgs').innerHTML = '';
  try{
    const res = await fetch('/api/build', {method:'POST', body:fd});
    const j = await res.json();
    if(!res.ok) throw new Error(j.error || res.statusText);
    R = j; file = null;
    if(!$('#month').value) $('#month').value = R.base.slice(0,7);
    render();
  }catch(e){ msg(esc(e.message), 'err'); }
  finally{ b.textContent = '명세서 만들기'; b.disabled = !R && !file; }
};

function render(){
  $('#result').classList.remove('hidden');
  R.warnings.forEach(w => msg('⚠ ' + esc(w), 'warn'));
  const ok1 = R.check_sum_ok, ok2 = R.ledger_ok;
  const acctTiles = R.by_account.map(a => `<div class="kpi"><div class="t">${esc(a.acct)}</div><div class="v">${fmt(a.balance)}</div><div class="s">발생금액 ${fmt(a.amount)}</div></div>`).join('');
  $('#kpis').innerHTML = `
    <div class="kpi main"><div class="t">기준일 선급비용 잔액 · ${R.base}${R.base_auto?' (자동)':''}</div><div class="v">${fmt(R.total_balance)}</div><div class="s">${esc(R.source_name)} · ${R.n}건 · 발생금액 ${fmt(R.total_amount)}</div></div>
    ${acctTiles}
    <div class="kpi"><div class="t">검증</div>
      <div style="margin-top:4px">월별비용 합계 = 발생금액 <span class="badge ${ok1?'ok':'bad'}">${ok1?'전건 일치':'불일치 '+R.check_sum_bad.length+'건'}</span></div>
      ${R.has_ledger?`<div>원장 대사(결산일자 기준) <span class="badge ${ok2?'ok':'bad'}">${ok2?'전건 일치':'차이 '+R.ledger_bad.length+'건'}</span></div>`:'<div class="s">발생계산금액 열 없음 — 원장 대사 생략</div>'}
    </div>`;
  $('#dl').textContent = `엑셀 다운로드 · ${R.filename}`;
  $('#save').classList.toggle('hidden', !!R.cloud);
  draw();
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  tab = b.dataset.t; draw();
});

function mcls(i){ const m = R.months[i], bm = R.base.slice(0,7); return m === bm ? 'cur' : (m < bm ? 'past' : ''); }
const mlabel = m => `${m.slice(0,4)}.${m.slice(5)}`;

function draw(){
  const T = $('#tbl'); let h = '';
  const legendMonths = '<i style="background:var(--past)"></i>기준일 이전 월<i style="background:var(--cur)"></i>기준월';
  if(tab === 'month'){
    h = `<tr><th>월</th><th>발생 비용(합계)</th>${R.by_account.map(a=>`<th>${esc(a.acct)}<br>비용</th>`).join('')}<th>월말 잔액(합계)</th>${R.by_account.map(a=>`<th>${esc(a.acct)}<br>잔액</th>`).join('')}</tr>`;
    R.months.forEach((m,i) => {
      const c = mcls(i);
      h += `<tr><td class="c ${c}">${mlabel(m)}</td><td class="n ${c}">${fmt(R.month_expense[i])}</td>${R.by_account.map(a=>`<td class="n ${c}">${fmt(a.expense[i])}</td>`).join('')}<td class="n ${c}"><b>${fmt(R.month_balance[i])}</b></td>${R.by_account.map(a=>`<td class="n ${c}">${fmt(a.month_balance[i])}</td>`).join('')}</tr>`;
    });
    h += `<tr class="tot"><td class="c">합계</td><td class="n">${fmt(R.month_expense.reduce((s,v)=>s+v,0))}</td>${R.by_account.map(a=>`<td class="n">${fmt(a.expense.reduce((s,v)=>s+v,0))}</td>`).join('')}<td></td>${R.by_account.map(()=>'<td></td>').join('')}</tr>`;
    $('#legend').innerHTML = '월말 잔액은 회계일자(지급) 이전 월을 0으로 둡니다.' + legendMonths;
  } else if(tab === 'items'){
    h = '<tr><th>No</th><th>전표번호</th><th>회계일자</th><th>계정과목명</th><th>거래처명</th><th>적요</th><th>발생금액</th><th>시작시간</th><th>종료시간</th><th>총기간(분)</th><th>잔여기간(분)</th><th>잔여비율</th><th>기준일까지 비용 누계</th><th>기준일 잔액</th></tr>';
    R.items.forEach(x => h += `<tr><td class="c">${x.no}</td><td>${esc(x.voucher)}</td><td class="c">${x.pay}</td><td>${esc(x.acct)}</td><td>${esc(x.vendor)}</td><td class="memo" title="${esc(x.memo)}">${esc(x.memo)}</td><td class="n">${fmt(x.amt)}</td><td class="c">${x.start}</td><td class="c">${x.end}</td><td class="n">${x.total_min.toLocaleString()}</td><td class="n">${x.rem_min.toLocaleString()}</td><td class="c">${x.ratio.toFixed(5)}</td><td class="n">${fmt(x.cum)}</td><td class="n"><b>${fmt(x.base_bal)}</b></td></tr>`);
    h += `<tr class="tot"><td colspan="6" class="c">합계</td><td class="n">${fmt(R.total_amount)}</td><td colspan="5"></td><td class="n">${fmt(R.total_amount - R.total_balance)}</td><td class="n">${fmt(R.total_balance)}</td></tr>`;
    $('#legend').innerHTML = `원자료 시트 '${esc(R.sheet)}' ${R.first}~${R.last}행. 잔여비율 = ROUND(잔여분 ÷ 총분, 5), 잔액 = ROUND(발생금액 × 잔여비율, 0).`;
  } else if(tab === 'matrix' || tab === 'balmatrix'){
    const key = tab === 'matrix' ? 'expense' : 'balance';
    h = `<tr><th class="stick">No</th><th class="stick2">계정과목명</th><th>거래처명</th><th>발생금액</th>${R.months.map((m,i)=>`<th class="${mcls(i)==='cur'?'cur':''}">${mlabel(m)}</th>`).join('')}${key==='expense'?'<th>합계</th>':''}</tr>`;
    R.items.forEach(x => {
      h += `<tr><td class="c stick">${x.no}</td><td class="stick2">${esc(x.acct)}</td><td>${esc(x.vendor)}</td><td class="n">${fmt(x.amt)}</td>${x[key].map((v,i)=>`<td class="n ${mcls(i)}">${fmt(v)}</td>`).join('')}${key==='expense'?`<td class="n"><b>${fmt(x.expense.reduce((s,v)=>s+v,0))}</b></td>`:''}</tr>`;
    });
    const tots = key === 'expense' ? R.month_expense : R.month_balance;
    h += `<tr class="tot"><td class="stick"></td><td class="stick2">합계</td><td></td><td class="n">${fmt(R.total_amount)}</td>${tots.map(v=>`<td class="n">${fmt(v)}</td>`).join('')}${key==='expense'?`<td class="n">${fmt(tots.reduce((s,v)=>s+v,0))}</td>`:''}</tr>`;
    $('#legend').innerHTML = (key==='expense' ? '월별 비용 = 전월말 잔액 − 당월말 잔액. 건별 합계는 발생금액과 같습니다.' : '각 월말 24:00 기준 잔액. 회계일자 이전 월은 0.') + legendMonths;
  } else {
    if(!R.has_ledger){ T.innerHTML = '<tr><td>원자료에 발생계산금액 열이 없어 원장 대사를 하지 않았습니다.</td></tr>'; $('#legend').innerHTML=''; return; }
    h = '<tr><th>No</th><th>원자료 행</th><th>계정과목명</th><th>거래처명</th><th>적요</th><th>원장 결산일자</th><th>원장 잔액<br>(발생계산금액)</th><th>결산일자 기준<br>재계산 잔액</th><th>차이</th></tr>';
    R.items.forEach(x => h += `<tr><td class="c">${x.no}</td><td class="c">${x.row}</td><td>${esc(x.acct)}</td><td>${esc(x.vendor)}</td><td class="memo" title="${esc(x.memo)}">${esc(x.memo)}</td><td class="c">${x.close || '(기준일)'}</td><td class="n">${fmt(x.ledger)}</td><td class="n">${fmt(x.recalc)}</td><td class="n ${x.diff&&Math.abs(x.diff)>0.5?'bad':''}">${fmt(x.diff)}</td></tr>`);
    const sum = k => R.items.reduce((s,x)=>s+(x[k]||0),0);
    h += `<tr class="tot"><td colspan="6" class="c">합계</td><td class="n">${fmt(sum('ledger'))}</td><td class="n">${fmt(sum('recalc'))}</td><td class="n">${fmt(sum('diff'))}</td></tr>`;
    const dist = Object.entries(R.close_dist).map(([d,c])=>`${d} ${c}건`).join(', ');
    $('#legend').innerHTML = `원자료에는 이전 결산에서 넘어온 행이 섞여 있으므로 각 행의 결산일자 시점 잔액과 비교합니다. 결산일자 분포: ${esc(dist)}`;
  }
  T.innerHTML = h;
}

$('#dl').onclick = () => {
  if(!R.xlsx_b64){ location.href = '/api/download/' + R.job; return; }
  const bin = atob(R.xlsx_b64), buf = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = R.filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#save').onclick = async () => {
  let res = await fetch('/api/save/' + R.job, {method:'POST'});
  if(res.status === 409){
    if(!confirm(`작업 폴더에 ${R.filename} 파일이 이미 있습니다.\n직접 고친 내용이 있다면 사라집니다. 덮어쓸까요?`)) return;
    res = await fetch('/api/save/' + R.job + '?overwrite=1', {method:'POST'});
  }
  const j = await res.json();
  $('#msgs').querySelectorAll('.ok').forEach(e => e.remove());
  if(res.ok) msg('저장했습니다: ' + esc(j.path) + ' — Excel에서 처음 열 때 수식이 다시 계산됩니다. 숫자를 한 번 확인해 주세요.', 'ok');
  else msg(esc(j.error), 'err');
};
</script>
</body>
</html>
